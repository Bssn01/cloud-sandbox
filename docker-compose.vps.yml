# ─────────────────────────────────────────────────────────────────────────────
# CLOUD (VPS) stack — deployed to a small VPS via scripts/deploy-vps.sh.
# Hosts the SHARED memory tier so all sub-agents (and other devices) see the
# same org memory. Optionally mirrors the Paperclip control plane for 24/7
# operation when the local machine is offline (decided in Phase 6).
#
# NOTE: image reference is a placeholder; the concrete provider (hindsight vs
# retaindb) is finalized in Phase 3 after a self-host smoke test.
# ─────────────────────────────────────────────────────────────────────────────

services:
  hermes-memory:
    # Self-hosted Hermes external memory provider (knowledge graph / vectors).
    image: hindsight/hindsight:latest    # TODO(phase3): verify image + tag
    environment:
      - HINDSIGHT_API_KEY=${HERMES_REMOTE_API_KEY}
      - HINDSIGHT_NAMESPACE=${HERMES_SHARED_NAMESPACE:-org-default}
    ports:
      - "443:8443"
    volumes:
      - memory-data:/var/lib/hindsight
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://localhost:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  memory-data:
